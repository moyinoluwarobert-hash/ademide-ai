services:
  - type: worker
    name: ademide-ai-paper-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POLL_SECONDS
        value: "60"
      - key: RISK_FRACTION
        value: "0.005"
      - key: STOP_FRACTION
        value: "0.015"
      - key: TARGET_FRACTION
        value: "0.03"
      - key: MAX_EXPOSURE
        value: "0.25"
      - key: DAILY_LOSS_LIMIT
        value: "0.02"
      - key: MAX_DRAWDOWN
        value: "0.06"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: COOLDOWN_MINUTES
        value: "30"
      - key: FEE_RATE
        value: "0.001"
